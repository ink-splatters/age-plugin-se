[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/example/age-plugin-se-rs"
keywords = ["age", "encryption", "secure-enclave", "apple", "cryptography"]
categories = ["cryptography", "authentication"]

[workspace.dependencies]
# Cryptography
p256 = { version = "0.13", features = ["ecdh"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"

# Encoding
bech32 = "0.11"
base64 = "0.22"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Error handling
thiserror = "2.0"

# Utilities
bitflags = "2.6"
zeroize = { version = "1.8", features = ["derive"] }

# macOS frameworks
core-foundation = "0.10"
core-foundation-sys = "0.8"
security-framework-sys = "2.14"

# Testing
tempfile = "3.14"

[workspace.metadata.crane]
name = "age-plugin-se"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
